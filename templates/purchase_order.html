{% extends "base.html" %}

{% block title %}Purchase Order - Hospital Management System{% endblock %}

{% block content %}
<div class="container mt-4">
    <div class="row">
        <div class="col-md-10 offset-md-1">
            <div class="card">
                <div class="card-header bg-success text-white">
                    <h4 class="mb-0"><i class="fas fa-shopping-cart"></i> Create Purchase Order</h4>
                </div>
                <div class="card-body">
                    <form method="POST" action="{{ url_for('purchase_order') }}">
                        <div class="row">
                            <div class="col-md-6">
                                <div class="form-group">
                                    <label>Supplier</label>
                                    <select name="supplier_id" class="form-control" required>
                                        <option value="">Select Supplier</option>
                                        {% if suppliers %}
                                        {% for supplier in suppliers %}
                                        <option value="{{ supplier.id }}">{{ supplier.name }}</option>
                                        {% endfor %}
                                        {% endif %}
                                    </select>
                                </div>
                            </div>
                            <div class="col-md-6">
                                <div class="form-group">
                                    <label>Expected Delivery Date</label>
                                    <input type="date" name="delivery_date" class="form-control" required>
                                </div>
                            </div>
                        </div>

                        <h5 class="mt-3">Order Items</h5>
                        <div id="orderItems">
                            <div class="row order-item mb-2">
                                <div class="col-md-5">
                                    <input type="text" name="item_name[]" class="form-control" placeholder="Item Name"
                                        required>
                                </div>
                                <div class="col-md-2">
                                    <input type="number" name="quantity[]" class="form-control" placeholder="Qty"
                                        required>
                                </div>
                                <div class="col-md-2">
                                    <input type="number" name="unit_price[]" class="form-control" placeholder="Price"
                                        step="0.01" required>
                                </div>
                                <div class="col-md-2">
                                    <input type="text" class="form-control" placeholder="Total" readonly>
                                </div>
                                <div class="col-md-1">
                                    <button type="button" class="btn btn-danger btn-sm" onclick="removeItem(this)">
                                        <i class="fas fa-trash"></i>
                                    </button>
                                </div>
                            </div>
                        </div>

                        <button type="button" class="btn btn-secondary btn-sm mb-3" onclick="addItem()">
                            <i class="fas fa-plus"></i> Add Item
                        </button>

                        <div class="row">
                            <div class="col-md-8">
                                <div class="form-group">
                                    <label>Notes</label>
                                    <textarea name="notes" class="form-control" rows="3"></textarea>
                                </div>
                            </div>
                            <div class="col-md-4">
                                <div class="card bg-light">
                                    <div class="card-body">
                                        <h6>Order Summary</h6>
                                        <p><strong>Subtotal:</strong> $<span id="subtotal">0.00</span></p>
                                        <p><strong>Tax (10%):</strong> $<span id="tax">0.00</span></p>
                                        <h5><strong>Total:</strong> $<span id="total">0.00</span></h5>
                                    </div>
                                </div>
                            </div>
                        </div>

                        <div class="form-group mt-3">
                            <button type="submit" class="btn btn-success">
                                <i class="fas fa-check"></i> Create Purchase Order
                            </button>
                            <a href="{{ url_for('inventory') }}" class="btn btn-secondary">
                                <i class="fas fa-times"></i> Cancel
                            </a>
                        </div>
                    </form>
                </div>
            </div>
        </div>
    </div>
</div>

<script>
    function addItem() {
        const itemHtml = `
        <div class="row order-item mb-2">
            <div class="col-md-5">
                <input type="text" name="item_name[]" class="form-control" placeholder="Item Name" required>
            </div>
            <div class="col-md-2">
                <input type="number" name="quantity[]" class="form-control" placeholder="Qty" required onchange="calculateTotal()">
            </div>
            <div class="col-md-2">
                <input type="number" name="unit_price[]" class="form-control" placeholder="Price" step="0.01" required onchange="calculateTotal()">
            </div>
            <div class="col-md-2">
                <input type="text" class="form-control" placeholder="Total" readonly>
            </div>
            <div class="col-md-1">
                <button type="button" class="btn btn-danger btn-sm" onclick="removeItem(this)">
                    <i class="fas fa-trash"></i>
                </button>
            </div>
        </div>
    `;
        document.getElementById('orderItems').insertAdjacentHTML('beforeend', itemHtml);
    }

    function removeItem(button) {
        button.closest('.order-item').remove();
        calculateTotal();
    }

    function calculateTotal() {
        let subtotal = 0;
        document.querySelectorAll('.order-item').forEach(item => {
            const qty = parseFloat(item.querySelector('input[name="quantity[]"]').value) || 0;
            const price = parseFloat(item.querySelector('input[name="unit_price[]"]').value) || 0;
            const total = qty * price;
            item.querySelector('input[readonly]').value = total.toFixed(2);
            subtotal += total;
        });

        const tax = subtotal * 0.1;
        const total = subtotal + tax;

        document.getElementById('subtotal').textContent = subtotal.toFixed(2);
        document.getElementById('tax').textContent = tax.toFixed(2);
        document.getElementById('total').textContent = total.toFixed(2);
    }
</script>
{% endblock %}
