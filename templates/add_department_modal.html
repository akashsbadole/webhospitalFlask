<div class="modal-header">
    <h5 class="modal-title">
        <i class="fas fa-building text-primary"></i> Add New Department
    </h5>
    <button type="button" class="btn-close" data-bs-dismiss="modal"></button>
</div>
<form hx-post="/admin/department/add" hx-target="#departments-list">
    <div class="modal-body">
        <div class="row">
            <div class="col-md-6">
                <div class="mb-3">
                    <label for="name" class="form-label">Department Name *</label>
                    <input type="text" class="form-control" id="name" name="name" required>
                </div>

                <div class="mb-3">
                    <label for="code" class="form-label">Department Code *</label>
                    <input type="text" class="form-control" id="code" name="code" required
                        placeholder="e.g., CARD, NEURO" maxlength="10">
                </div>
            </div>

            <div class="col-md-6">
                <div class="mb-3">
                    <label for="head_of_department" class="form-label">Head of Department</label>
                    <select class="form-select" id="head_of_department" name="head_of_department">
                        <option value="">Select Doctor</option>
                        {% for doctor in doctors %}
                        <option value="{{ doctor.id }}">{{ doctor.full_name }} - {{ doctor.specialization or 'General'
                            }}</option>
                        {% endfor %}
                    </select>
                </div>
            </div>
        </div>

        <div class="mb-3">
            <label for="description" class="form-label">Description</label>
            <textarea class="form-control" id="description" name="description" rows="3"
                placeholder="Brief description of the department"></textarea>
        </div>
    </div>
    <div class="modal-footer">
        <button type="button" class="btn btn-secondary" data-bs-dismiss="modal">Cancel</button>
        <button type="submit" class="btn btn-primary">
            <i class="fas fa-save"></i> Add Department
        </button>
    </div>
</form>
